
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build iOS IPA for Sideloadly
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure iOS Widget Extension
        run: |
          gem install --no-document xcodeproj
          ruby ios/configure_widget.rb

      - name: Build iOS Release
        run: flutter build ios --release --no-codesign

      - name: Verify Widget Extension
        shell: bash
        run: |
          APP="build/ios/iphoneos/Runner.app"
          EXT="$APP/PlugIns/TaskWidgetExtension.appex"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Runner.app not found"
            exit 1
          fi

          if [ ! -d "$EXT" ]; then
            echo "ERROR: Widget extension is missing"
            echo "Check the Xcode project and configure_widget.rb"
            exit 1
          fi

          echo "App bundle found"
          echo "Widget extension found"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$EXT/Info.plist"

      - name: Package IPA for Sideloadly
        shell: bash
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app \
            build/ios/ipa/Payload/

          cd build/ios/ipa
          zip -qr -y flutter_pgi.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter_pgi_ipa
          path: build/ios/ipa/flutter_pgi.ipa
          retention-days: 14
