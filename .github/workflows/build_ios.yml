name: Build iOS IPA

on:
  workflow_dispatch: # Allows you to manually trigger the build from GitHub UI
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure iOS Widget Extension
        run: |
          gem install --no-document xcodeproj
          ruby ios/configure_widget.rb

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -y flutter_pgi.ipa Payload

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter_pgi_ipa
          path: build/ios/ipa/flutter_pgi.ipa
          retention-days: 14
